<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@NAME@</title>
<style>
  /* Apple HIG-informed tokens (see references/webui.md): one accent, grouped
     cards, tabular numbers, light+dark, 44px targets, safe areas. */
  :root {
    --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --secondary:#6e6e73;
    --accent:#007aff; --separator:#e5e5ea; --track:#e9e9ee;
    --ok:#34c759; --warn:#ff9500;
    --bar:rgba(249,249,249,.82);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1c1c1e; --card:#2c2c2e; --text:#ffffff; --secondary:#98989f;
      --accent:#0a84ff; --separator:#3a3a3c; --track:#3a3a3c;
      --ok:#30d158; --warn:#ff9f0a;
      --bar:rgba(28,28,30,.82);
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px; line-height:1.35;
  }
  header {
    padding:calc(18px + env(safe-area-inset-top)) 16px 6px;
    max-width:720px; margin:0 auto;
  }
  h1 { margin:0; font-size:34px; font-weight:700; letter-spacing:-.4px; }
  .sub { color:var(--secondary); font-size:15px; margin-top:4px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ok); margin-inline-end:6px; vertical-align:1px; }
  .dot.stale { background:var(--warn); }
  main { padding:10px 16px calc(24px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; }
  .card h2 { margin:0 0 8px; font-size:17px; font-weight:600; }
  .big { font-size:34px; font-weight:700; letter-spacing:-.4px; font-variant-numeric:tabular-nums; }
  .small { font-size:13px; color:var(--secondary); margin-top:6px; line-height:1.5; }
  .bar { height:8px; border-radius:99px; background:var(--track); overflow:hidden; margin-top:12px; }
  .bar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .35s ease; }
  button {
    background:var(--accent); color:#fff; border:0; border-radius:14px;
    padding:14px 16px; font-size:17px; font-weight:600; width:100%;
    min-height:50px; cursor:pointer; font-family:inherit;
  }
  button:active { opacity:.75; }
  code { direction:ltr; unicode-bidi:embed; font-size:12.5px; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition:none; } }
</style>
</head>
<body>
<header>
  <h1>@NAME@</h1>
  <div class="sub"><span class="dot" id="dot"></span><span id="state">connecting…</span> · <span id="mode">—</span> · <span id="age">—</span></div>
</header>
<main>
  <section class="card" aria-label="Live status">
    <h2>Live</h2>
    <div class="big" id="load">—</div>
    <div class="small">Load average (1 min) · Memory used: <span id="mem">—</span></div>
    <div class="bar" aria-hidden="true"><div id="memBar" style="width:0%"></div></div>
    <div class="small">Updated: <span id="updated">—</span></div>
  </section>
  <section class="card">
    <button id="refreshBtn">Refresh now</button>
    <p class="small" style="margin-top:12px">
      Live updates every 0.5 s while this page is open (manager bridge when present, service files otherwise). Polling pauses while hidden and never writes files.<br>
      Log: <code>/sdcard/Documents/@ID@/@ID@-debug.log</code>
    </p>
  </section>
</main>
<script>
"use strict";
/* Starter WebUI following references/webui.md: self-contained, zero external
   URLs, bridge feature-detected, file fallback, textContent only, freshness. */
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
let timer = null, lastOk = 0;
function hasBridge() { try { return typeof ksu !== "undefined" && typeof ksu.exec === "function"; } catch (e) { return false; } }
function execRead(cmd) {
  return new Promise(resolve => {
    if (!hasBridge()) { resolve(null); return; }
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    try { ksu.exec(cmd, "{}", (errno, stdout) => finish(errno === 0 ? String(stdout || "") : null)); }
    catch (e) { finish(null); }
    setTimeout(() => finish(null), 1500);
  });
}
function show(load, memPct, updated) {
  lastOk = Date.now();
  $("load").textContent = load.toFixed(2);
  $("mem").textContent = memPct + "%";
  $("memBar").style.width = Math.max(0, Math.min(100, memPct)) + "%";
  $("updated").textContent = updated || new Date().toLocaleTimeString("en-GB");
  freshness();
}
function freshness() {
  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : -1;
  const stale = age < 0 || age > 5;
  $("dot").className = "dot" + (stale ? " stale" : "");
  $("state").textContent = stale ? "stale data" : "live";
  $("age").textContent = age < 0 ? "no data yet" : (age + "s ago");
}
async function poll() {
  if (document.hidden) return;
  if (hasBridge()) {
    $("mode").textContent = "bridge · 0.5s";
    const out = await execRead("cat /proc/loadavg; echo ===; grep -E '^(MemTotal|MemAvailable):' /proc/meminfo");
    if (out) {
      const p = out.split("===");
      const mt = /MemTotal:\s*(\d+)/.exec(p[1] || ""), ma = /MemAvailable:\s*(\d+)/.exec(p[1] || "");
      const memPct = (mt && ma && +mt[1] > 0) ? Math.round((+mt[1] - +ma[1]) * 100 / +mt[1]) : 0;
      show(num((p[0] || "").trim().split(/\s+/)[0]), memPct, "");
      return;
    }
    $("mode").textContent = "files · fallback";
  } else {
    $("mode").textContent = "files · 2s";
  }
  try {
    const r = await fetch("report.json?x=" + Date.now());
    if (!r.ok) throw new Error("no report");
    const d = await r.json();
    show(num(d.loadavg), num(d.mem_used_pct), d.updated || "");
  } catch (e) { freshness(); }
}
function start() { stop(); poll(); timer = setInterval(poll, hasBridge() ? 500 : 2000); }
function stop() { if (timer) { clearInterval(timer); timer = null; } }
document.addEventListener("visibilitychange", () => { document.hidden ? stop() : start(); });
window.addEventListener("pagehide", stop);
$("refreshBtn").addEventListener("click", poll);
start();
</script>
</body>
</html>
